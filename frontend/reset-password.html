<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha - Calculadora Materiais CCM</title>
  <style>
    :root {
      --bg-color: #f3f6fa;
      --card-bg: #ffffff;
      --border-color: #d1d5db;
      --text-main: #111827;
      --text-muted: #4b5563;
      --accent: #0f766e;
      --accent-hover: #0d5e58;
      --success: #166534;
      --error: #b91c1c;
      --font-sans: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }

    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 1.25rem; color: var(--accent); }
    .brand p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }

    .input-wrapper { position: relative; }
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: var(--accent); }

    .btn-submit {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    .status-msg.ok {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--success);
    }
    .status-msg.err {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error);
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.82rem;
    }
    .back-link a { color: var(--text-muted); text-decoration: underline; }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <h1>Redefinir Senha</h1>
      <p>Calculadora de Materiais CCM</p>
    </div>

    <div id="formSection">
      <form id="resetForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="password">Nova senha</label>
          <div class="input-wrapper">
            <input type="password" id="password" required placeholder="••••••••" minlength="6" />
          </div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirmar senha</label>
          <div class="input-wrapper">
            <input type="password" id="confirm" required placeholder="••••••••" minlength="6" />
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">
          <span class="spinner" id="btnLoader"></span>
          <span id="btnText">Redefinir senha</span>
        </button>
      </form>
      <div class="status-msg" id="statusBox"></div>
    </div>

    <div class="back-link">
      <a href="/login">Voltar para o login</a>
    </div>
  </div>

  <script>
    const statusBox = document.getElementById("statusBox");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnLoader = document.getElementById("btnLoader");
    const btnText = document.getElementById("btnText");

    function showStatus(msg, ok = true) {
      statusBox.textContent = msg;
      statusBox.className = ok ? "status-msg ok" : "status-msg err";
    }

    function parseHash() {
      const hash = window.location.hash.substring(1);
      const params = {};
      for (const part of hash.split("&")) {
        const [k, v] = part.split("=");
        if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || "");
      }
      return params;
    }

    const hashParams = parseHash();
    const recoveryToken = hashParams["access_token"] || "";
    const tokenType = hashParams["type"] || "";

    if (!recoveryToken || tokenType !== "recovery") {
      showStatus("Link inválido ou expirado. Solicite uma nova recuperação de senha.", false);
      document.getElementById("resetForm").style.display = "none";
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        showStatus("As senhas não coincidem.", false);
        return;
      }
      if (password.length < 6) {
        showStatus("A senha deve ter ao menos 6 caracteres.", false);
        return;
      }

      btnSubmit.disabled = true;
      btnLoader.style.display = "inline-block";
      btnText.textContent = "Aguarde...";
      statusBox.className = "status-msg";

      try {
        const resp = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: recoveryToken, password }),
        });

        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data?.detail || `Erro ${resp.status}`);
        }

        showStatus("Senha redefinida com sucesso! Redirecionando para o login...", true);
        setTimeout(() => { window.location.href = "/login"; }, 2000);
      } catch (err) {
        showStatus(String(err?.message || err || "Falha ao redefinir senha."), false);
        btnSubmit.disabled = false;
        btnLoader.style.display = "none";
        btnText.textContent = "Redefinir senha";
      }
    }
  </script>
</body>

</html>
